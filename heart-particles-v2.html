<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heart partivle version2 - Enhanced</title>
  <style>
    :root {
      --panel-bg: rgba(0, 0, 0, 0.7);
      --panel-text: #fff;
      --control-bg: rgba(100, 100, 100, 0.2);
    }

    body.light-mode {
      --panel-bg: rgba(255, 255, 255, 0.8);
      --panel-text: #333;
      --control-bg: rgba(200, 200, 200, 0.5);
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "Archivo Black", sans-serif;
      color: white;
      transition: background-color 0.5s ease;
    }

    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #controls-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    #toggle-controls,
    #toggle-fullscreen {
      background: var(--panel-bg);
      color: var(--panel-text);
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 5px;
      backdrop-filter: blur(5px);
      font-family: inherit;
      transition: all 0.3s ease;
    }

    #controls {
      background: var(--control-bg);
      color: var(--panel-text);
      padding: 15px;
      border-radius: 10px;
      max-width: 300px;
      backdrop-filter: blur(5px);
      display: block;
      transition: all 0.3s ease;
    }

    .control-group {
      margin: 10px 0;
      display: flex;
      align-items: center;
    }

    .control-group label {
      width: 100px;
      font-size: 14px;
      margin-right: 10px;
    }

    .control-group input[type="range"] {
      flex-grow: 1;
      margin-right: 10px;
    }

    .control-group span {
      width: 40px;
      text-align: right;
      font-size: 14px;
    }

    .control-group select {
      flex-grow: 1;
      padding: 5px;
      border-radius: 4px;
      background: #333;
      color: white;
      border: none;
      font-family: inherit;
    }

    body.light-mode .control-group select {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
    }

    #toggle-fullscreen {
      position: fixed;
      top: 20px;
      right: 20px;
    }

    @media (max-width: 600px) {
      #controls-container {
        top: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
      }

      .control-group label {
        width: 80px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="controls-container">
    <button id="toggle-controls">Controls</button>
    <button id="toggle-fullscreen">Full Screen</button>
    <div id="controls">
      <div class="control-group">
        <label for="theme">Theme:</label>
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="control-group">
        <label for="particleShape">Shape:</label>
        <select id="particleShape">
          <option value="heart">Heart</option>
          <option value="circle">Circle</option>
          <option value="star">Star</option>
          <option value="square">Square</option>
        </select>
      </div>
      <div class="control-group">
        <label for="colorScheme">Colors:</label>
        <select id="colorScheme">
          <option value="rainbow">Rainbow</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="monochrome">Monochrome</option>
        </select>
      </div>
      <div class="control-group">
        <label for="particleSize">Size:</label>
        <input type="range" id="particleSize" min="1" max="20" value="10">
        <span id="particleSizeValue">10</span>
      </div>
      <div class="control-group">
        <label for="particleCount">Particles:</label>
        <input type="range" id="particleCount" min="10" max="100" value="32">
        <span id="particleCountValue">32</span>
      </div>
      <div class="control-group">
        <label for="speed">Speed:</label>
        <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
        <span id="speedValue">1</span>
      </div>
      <div class="control-group">
        <label for="mouseInfluence">Follow:</label>
        <input type="range" id="mouseInfluence" min="0" max="100" value="50">
        <span id="mouseInfluenceValue">50</span>
      </div>
      <div class="control-group">
        <label for="glowIntensity">Glow:</label>
        <input type="range" id="glowIntensity" min="0" max="30" value="15">
        <span id="glowIntensityValue">15</span>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script>
    // Configuration
    const config = {
      particleCount: 32,
      speed: 1,
      colorScheme: 'rainbow',
      mouseInfluence: 50,
      particleSize: 10,
      glowIntensity: 15,
      particleShape: 'heart',
      theme: 'dark'
    };

    // Canvas setup
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let canvasWidth = canvas.width = window.innerWidth;
    let canvasHeight = canvas.height = window.innerHeight;

    // Animation state
    let trails = [];
    let heartPath = [];
    let mouseX = canvasWidth / 2;
    let mouseY = canvasHeight / 2;
    let mouseActive = false;
    let animationRunning = false;

    // Initialize heart path points
    function initHeartPath() {
      heartPath = [];
      const PI2 = Math.PI * 2;
      const steps = 100;

      for (let i = 0; i < steps; i++) {
        const t = (i / steps) * PI2;
        heartPath.push([
          canvasWidth / 2 + 180 * Math.pow(Math.sin(t), 3),
          canvasHeight / 2 + 10 * (-(15 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)))
        ]);
      }
    }

    // Initialize particles
    function initParticles() {
      trails = [];
      for (let i = 0; i < config.particleCount; i++) {
        createTrail(Math.random() * canvasWidth, Math.random() * canvasHeight, i);
      }
    }

    function createTrail(x, y, index, isBurst = false) {
      const trail = [];
      let hue, saturation = Math.random() * 40 + 60;
      let brightness = config.theme === 'dark' ? Math.random() * 60 + 40 : Math.random() * 40 + 20;

      switch (config.colorScheme) {
        case 'red': hue = Math.random() * 20 + 350; break;
        case 'blue': hue = Math.random() * 20 + 200; break;
        case 'green': hue = Math.random() * 20 + 100; break;
        case 'monochrome': hue = 0; saturation = 0; break;
        default: hue = (index / config.particleCount) * 360;
      }

      const leader = {
        x, y,
        velX: isBurst ? (Math.random() - 0.5) * 20 : 0,
        velY: isBurst ? (Math.random() - 0.5) * 20 : 0,
        radius: config.particleSize / 2,
        speed: Math.random() + 1,
        targetIndex: Math.floor(Math.random() * heartPath.length),
        direction: Math.random() > 0.5 ? 1 : -1,
        friction: isBurst ? 0.95 : Math.random() * 0.2 + 0.7,
        color: `hsla(${hue},${saturation}%,${brightness}%,${config.theme === 'dark' ? 0.1 : 0.2})`,
        glowColor: `hsla(${hue},${saturation}%,${brightness}%,0.8)`,
        burst: isBurst
      };

      trail.push(leader);
      const trailLength = isBurst ? 5 : 10;
      for (let k = 1; k < trailLength; k++) {
        trail.push({ ...leader, radius: leader.radius * (1 - k / trailLength) });
      }
      trails.push(trail);
    }

    function createBurst(x, y) {
      for (let i = 0; i < 15; i++) {
        createTrail(x, y, Math.random() * config.particleCount, true);
      }
      if (trails.length > config.particleCount + 60) {
        trails.splice(0, 15);
      }
    }

    function drawHeart(x, y, size) {
      ctx.moveTo(x, y + size / 4);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + size / 4);
      ctx.bezierCurveTo(x - size / 2, y + size / 2, x, y + size * 0.75, x, y + size);
      ctx.bezierCurveTo(x, y + size * 0.75, x + size / 2, y + size / 2, x + size / 2, y + size / 4);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 4);
    }

    function drawStar(x, y, size) {
      const spikes = 5;
      const outerRadius = size;
      const innerRadius = size / 2;
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;

      ctx.moveTo(x, y - outerRadius);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(x + Math.cos(rot) * outerRadius, y + Math.sin(rot) * outerRadius);
        rot += step;
        ctx.lineTo(x + Math.cos(rot) * innerRadius, y + Math.sin(rot) * innerRadius);
        rot += step;
      }
      ctx.lineTo(x, y - outerRadius);
    }

    function renderParticle(particle) {
      ctx.shadowBlur = config.glowIntensity;
      ctx.shadowColor = particle.glowColor;
      ctx.fillStyle = particle.color;
      ctx.beginPath();

      const size = particle.radius * 2;

      switch (config.particleShape) {
        case 'heart':
          drawHeart(particle.x, particle.y - size / 2, size);
          break;
        case 'star':
          drawStar(particle.x, particle.y, size);
          break;
        case 'square':
          ctx.rect(particle.x - size / 2, particle.y - size / 2, size, size);
          break;
        case 'circle':
        default:
          ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          break;
      }

      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function animationLoop() {
      if (!animationRunning) return;

      try {
        // Dynamic background
        const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, Math.max(canvasWidth, canvasHeight));
        if (config.theme === 'dark') {
          grad.addColorStop(0, "#1a001a");
          grad.addColorStop(1, "#000000");
        } else {
          grad.addColorStop(0, "#fff0f5");
          grad.addColorStop(1, "#ffffff");
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        trails.forEach((trail, trailIndex) => {
          const leader = trail[0];
          const target = heartPath[leader.targetIndex % heartPath.length];

          if (leader.burst) {
            leader.x += leader.velX;
            leader.y += leader.velY;
            leader.velX *= leader.friction;
            leader.velY *= leader.friction;
            if (Math.abs(leader.velX) < 0.1 && Math.abs(leader.velY) < 0.1) leader.burst = false;
          } else {
            const dx = leader.x - target[0];
            const dy = leader.y - target[1];
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            if (dist < 10) {
              if (Math.random() > 0.95) {
                leader.targetIndex = Math.floor(Math.random() * heartPath.length);
              } else {
                leader.targetIndex = (leader.targetIndex + leader.direction + heartPath.length) % heartPath.length;
              }
            }

            if (mouseActive && config.mouseInfluence > 0) {
              const mdx = mouseX - leader.x;
              const mdy = mouseY - leader.y;
              const mdist = Math.sqrt(mdx * mdx + mdy * mdy) || 1;
              if (mdist < 200) {
                const force = (1 - mdist / 200) * (config.mouseInfluence / 20);
                leader.velX += mdx / mdist * force;
                leader.velY += mdy / mdist * force;
              }
            }

            leader.velX += -dx / dist * leader.speed * config.speed;
            leader.velY += -dy / dist * leader.speed * config.speed;
            leader.x += leader.velX;
            leader.y += leader.velY;
            leader.velX *= leader.friction;
            leader.velY *= leader.friction;
          }

          renderParticle(leader);
          for (let k = 1; k < trail.length; k++) {
            trail[k].x -= (trail[k].x - trail[k - 1].x) * (leader.burst ? 0.3 : 0.7);
            trail[k].y -= (trail[k].y - trail[k - 1].y) * (leader.burst ? 0.3 : 0.7);
            renderParticle(trail[k]);
          }
        });
      } catch (error) {
        console.error("Animation error:", error);
      }

      requestAnimationFrame(animationLoop);
    }

    function setupControls() {
      const controls = document.getElementById('controls');
      let controlsVisible = true;

      document.getElementById('toggle-controls').addEventListener('click', () => {
        controlsVisible = !controlsVisible;
        controls.style.display = controlsVisible ? 'block' : 'none';
      });

      document.getElementById('toggle-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      });

      document.getElementById('theme').addEventListener('change', (e) => {
        config.theme = e.target.value;
        document.body.classList.toggle('light-mode', config.theme === 'light');
        initParticles();
      });

      document.getElementById('particleShape').addEventListener('change', (e) => {
        config.particleShape = e.target.value;
      });

      document.getElementById('particleCount').addEventListener('input', (e) => {
        config.particleCount = parseInt(e.target.value);
        document.getElementById('particleCountValue').textContent = config.particleCount;
        initParticles();
      });

      document.getElementById('speed').addEventListener('input', (e) => {
        config.speed = parseFloat(e.target.value);
        document.getElementById('speedValue').textContent = config.speed;
      });

      document.getElementById('colorScheme').addEventListener('change', (e) => {
        config.colorScheme = e.target.value;
        initParticles();
      });

      document.getElementById('mouseInfluence').addEventListener('input', (e) => {
        config.mouseInfluence = parseInt(e.target.value);
        document.getElementById('mouseInfluenceValue').textContent = config.mouseInfluence;
      });

      document.getElementById('particleSize').addEventListener('input', (e) => {
        config.particleSize = parseInt(e.target.value);
        document.getElementById('particleSizeValue').textContent = config.particleSize;
        initParticles();
      });

      document.getElementById('glowIntensity').addEventListener('input', (e) => {
        config.glowIntensity = parseInt(e.target.value);
        document.getElementById('glowIntensityValue').textContent = config.glowIntensity;
      });

      canvas.addEventListener('mousedown', (e) => {
        if (e.target.id === 'c') createBurst(e.clientX, e.clientY);
      });
      canvas.addEventListener('touchstart', (e) => {
        if (e.target.id === 'c') {
          const touch = e.touches[0];
          createBurst(touch.clientX, touch.clientY);
          mouseX = touch.clientX; mouseY = touch.clientY;
          mouseActive = true;
        }
      }, { passive: true });

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        mouseActive = true;
      });
      document.addEventListener('mouseleave', () => mouseActive = false);

      window.addEventListener('resize', () => {
        canvasWidth = canvas.width = window.innerWidth;
        canvasHeight = canvas.height = window.innerHeight;
        initHeartPath();
      });
    }

    function init() {
      animationRunning = true;
      initHeartPath();
      initParticles();
      setupControls();
      animationLoop();
    }

    init();
  </script>
</body>

</html>
